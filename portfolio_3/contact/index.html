<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maxium-scale=1, user-scalable=no">
    <link rel="stylesheet" href="../style.css">
    <title>contact</title>
    <script src="https://cdn.jsdelivr.net/jquery.mixitup/latest/jquery.mixitup.min.js"></script>
    <script type="text/javascript">
        $(function() {
            $('.menu-btn').click(function() {
                $('header-nav').toggleClass('open');
            });

            $('header-nav a').click(function() {
                $('header-nav').toggleClass('open');
            });
        })
    </script>
</head>

<body id="contact-home">
    <header id="contact-header">
        <div class="contact-container">
            <div class="contents-left">
                <a href="#home"><h1 class="logo"><span><img src="../test/dog.png" alt="logo"></span></h1></a>
            </div> <!-- .contents-left -->

        
            <div class="contents-right">
                <ul>
                    <li><a href="../index.html">HOME</a></li>
                </ul>
            </div><!-- .contents-right -->
        </div> <!-- .container -->
    </header> <!-- #header -->

    <section id="contact">
        <div class="form-blk">
            <div class="container">
                <h1>お問い合わせ</h1>
                <form method="post" action="kaede072215@gmail.com">
                    <table>
                        <tr>
                            <th><label for="your-name" class="your-name-c">お名前</label></th>
                            <td><input type="text" name="お名前" placeholder="姓　名" id="your-name"></td>
                        </tr>

                        <tr>
                            <th><label for="phone-num" class="phone-num-c">電話番号</label></th>
                            <td><input type="tel" name="電話番号" placeholder="080-1234-5678" id="phone-num"></td>
                        </tr>

                        <tr>
                            <th><label for="e-mail">メールアドレス</label></th>
                            <td><input type="email" name="メールアドレス" placeholder="mail.address@~~~~" id="e-mail"></td>
                        </tr>

                        <tr>
                            <th><label for="reservation">面談可能時間</label></th>
                            <td>
                                <select name="month" id="month">
                                    <option value="-">-</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </select> 月

                                <select name="day" id="day">
                                    <option value="-">-</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                    <option value="21">21</option>
                                    <option value="22">22</option>
                                    <option value="23">23</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>
                                    <option value="27">27</option>
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                </select> 日

                                <select name="time" id="time">
                                    <option value="-">-</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                </select> 時

                                <select name="time2" id="time2">
                                <option value="-">-</option>
                                    <option value="-">-</option>
                                    <option value="0">0</option>
                                    <option value="15">15</option>
                                    <option value="30">30</option>
                                    <option value="45">45</option>
                                </select> 分～
                            </td>
                        </tr>

                        <tr>
                            <th><label for="message">その他確認したい内容</label></th>
                            <td><textarea name="お問い合わせ内容" id="message"></textarea></td>
                        </tr>

                        <tr>
                            <td></td>
                            <td>
                                <p class="notes"><span>※</span>は必須項目です。</p>
                                <input type="submit" value="送信する" id="btn-submit">
                            </td>
                        </tr>
                    </table>
                </form>
            </div> <!-- .container -->
        </div> <!-- .form-blk -->
    </section> <!-- #contact -->
</body> <!-- #home -->

</html>
